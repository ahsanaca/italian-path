<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Italian Academy — Interactive Italian Learning</title>
<meta name="description" content="Learn Italian from the alphabet up — free trial">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#2c3e50">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Italian Academy">
<link rel="stylesheet" href="engine.css">
</head>
<body>

<div class="app-bar">
  <div class="brand" onclick="showDashboard()">🇮🇹 Italian Academy</div>
  <div class="header-stats">
    <span class="header-stat" title="Day streak">🔥 <span id="headerStreak">0</span></span>
    <span class="header-stat" title="XP earned">⭐ <span id="headerXp">0</span></span>
    <div class="overall-progress">
      <div class="overall-bar"><div class="overall-fill" id="overallFill" style="width:0%"></div></div>
      <span id="overallPct">0%</span>
    </div>
  </div>
  <button class="icon-btn" id="signOutBtn" onclick="doSignOut()" style="display:none;" title="Sign out">🚪</button>
</div>

<div class="page" id="pageRoot"></div>

<footer>Italian Academy · free trial · original content, built for a self-paced learning app<br>This is an early trial — spotted a typo, a grammar mistake, or anything confusing? Please tell us so we can fix it.</footer>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <button class="bottom-nav-btn active" id="bottomNavDashboard" onclick="showDashboard()">
      <span class="bnav-icon">🏠</span><span class="bnav-label">Dashboard</span>
    </button>
    <button class="bottom-nav-btn" id="bottomNavIndex" onclick="showIndex()">
      <span class="bnav-icon">📑</span><span class="bnav-label">Index</span>
    </button>
  </div>
</nav>

<script src="content.js"></script>
<script src="engine.js"></script>
<script src="voice-module.js"></script>
</body>
</html>
