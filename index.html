<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Italian Academy — Learn Italian & Patente B Theory</title>
<meta name="description" content="Learn Italian from the alphabet up, and prepare for the Italian driving theory exam (Patente B) with exam-style True/False questions and timed mock exams — free trial.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111922" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Italian Academy">
<link rel="stylesheet" href="engine.css">
<!-- Optional accounts: to switch on cross-device sync, set window.firebaseConfig
     in content.js and add the three Firebase <script> tags used by the Arabic app here. -->
</head>
<body>

<a class="skip-link" href="#pageRoot" onclick="event.preventDefault(); document.getElementById('pageRoot').focus();">Skip to content</a>

<header class="app-bar">
  <div class="app-bar-inner">
    <button class="brand" onclick="showDashboard()" aria-label="Italian Academy — home">
      <span class="brand-flag" aria-hidden="true"></span>
      <span>Italian Academy</span>
    </button>
    <nav class="nav-links" aria-label="Main">
      <button data-nav="dashboard" onclick="showDashboard()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Home</button>
      <button data-nav="index" onclick="showIndex()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Course</button>
      <button data-nav="trackSelect" onclick="showTrackSelector()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3l4 4-4 4"/><path d="M3 11V9a2 2 0 012-2h16"/><path d="M7 21l-4-4 4-4"/><path d="M21 13v2a2 2 0 01-2 2H3"/></svg>Courses</button>
    </nav>
    <button id="accountBtn" class="signout-btn" onclick="accountClick()" style="display:none;">Sign in</button>
  </div>
  <div class="overall-strip" role="progressbar" aria-label="Overall course progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="overallBar"><div id="overallFill" style="width:0%"></div></div>
</header>

<main class="page" id="pageRoot" tabindex="-1"></main>

<footer class="site-footer">
  <nav aria-label="Support">
    <a id="reportLink" href="#">Report a mistake</a>
  </nav>
  <div>Italian Academy — free trial, original content. Spotted a typo, a grammar mistake or a wrong rule? Please tell us so we can fix it.</div>
</footer>

<nav class="bottom-nav" aria-label="Main">
  <button data-nav="dashboard" onclick="showDashboard()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Home</button>
  <button data-nav="index" onclick="showIndex()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Course</button>
  <button data-nav="trackSelect" onclick="showTrackSelector()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3l4 4-4 4"/><path d="M3 11V9a2 2 0 012-2h16"/><path d="M7 21l-4-4 4-4"/><path d="M21 13v2a2 2 0 01-2 2H3"/></svg>Courses</button>
</nav>

<script src="content.js"></script>
<script src="signs.js"></script>
<script src="content-patente.js"></script>
<script src="engine.js"></script>
<script src="voice-module.js"></script>
</body>
</html>
